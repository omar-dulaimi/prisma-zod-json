name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publish, no tag, no push) - defaults on for safety'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Nothing is published unless the full suite, the packaged artefact and the live
  # database check have all passed on this commit.
  verify:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required. @semantic-release/npm requests a GitHub OIDC token and exchanges it with npm for a
      # short-lived publish credential; without this the exchange fails and there is no token to fall
      # back on, because the package disallows them.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'

      # Deliberately no `registry-url`: it writes an .npmrc containing an authToken placeholder, which
      # gets in the way of the OIDC exchange below.
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # No npm token: the package is configured for Trusted Publishing with tokens disallowed, so
      # auth is the OIDC exchange alone. Setting NPM_TOKEN here would write a conflicting .npmrc.
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-- --dry-run' || '' }}
